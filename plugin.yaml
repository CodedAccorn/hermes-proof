name: hermes-proof
version: "0.2.0"
description: Deterministic local-file outcome verification with persistent evidence reports
license: MIT
requires_hermes: ">=0.23.1"
provides_tools:
  - proof_verify
  - proof_report
config_schema:
  verification_root:
    type: str
    required: true
    label: Verification root
    description: Absolute directory HermesProof is allowed to verify
